# Create containers from images: utilies/{user,auth,printing} with exposed ports 8001, 8002, 8003 internally in network utilities_network
# Create container from image mongo with exposed port 27017 internally in network utilities_network

services:
  admin_panel:
    image: utilities/admin-panel
    container_name: utilities_admin-panel
    networks:
      - utilities_network
    env_file:
      - .docker.env
    ports:
      - "127.0.0.1:8000:80"

  user:
    image: utilities/user
    container_name: utilities_user
    networks:
      - utilities_network
    env_file:
      - .docker.env
    ports:
      - "127.0.0.1:8001:8001"

  auth:
    image: utilities/auth
    container_name: utilities_auth
    networks:
      - utilities_network
    env_file:
      - .docker.env
    ports:
      - "127.0.0.1:8002:8002"

  wg_portal:
    image: wgportal/wg-portal:v2
    container_name: utilities_wg-portal
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    network_mode: "host"
    env_file:
      - .docker.env
    environment:
      WG_PORTAL_CORE_IMPORT_EXISTING: "true"
      WG_PORTAL_CORE_RESTORE_STATE: "true"
      WG_PORTAL_WEB_LISTENING_ADDRESS: ":8888"
      WG_PORTAL_ADVANCED_CONFIG_STORAGE_PATH: "/etc/wireguard"
      WG_PORTAL_DATABASE_TYPE: "sqlite"
      WG_PORTAL_DATABASE_DSN: "/app/data/sqlite.db"
    volumes:
      - ./data/wg-portal:/app/data
      - /etc/wireguard:/etc/wireguard

  internal:
    image: utilities/internal
    container_name: utilities_internal
    networks:
      - utilities_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .docker.env
    ports:
      - "127.0.0.1:8003:8003"

  printing:
    image: utilities/printing
    container_name: utilities_printing
    networks:
      - utilities_network
    env_file:
      - .docker.env
    ports:
      - "127.0.0.1:8004:8004"

  sync:
    image: utilities/sync
    container_name: utilities_sync
    networks:
      - utilities_network
    env_file:
      - .docker.env
    ports:
      - "127.0.0.1:8005:8005"

  mongo:
    image: mongo
    container_name: utilities_mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - utilities_network

  redis:
    image: redis
    container_name: utilities_redis
    networks:
      - utilities_network

volumes:
  mongo_data:

networks:
  utilities_network:
    driver: bridge
