log_format custom '';

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Contestant and guest tunnel subnets (WG_CONTESTANT_BASE_SUBNET, WG_GUEST_BASE_SUBNET). A machine's user knows
# their own password, so from a shell they could log in and read /user/vpn/config, which carries their VNOJ API key;
# only the machine's root needs either, and it calls the public address. The full tunnel carries that call too, so
# a tunnel client is refused only on the private way in: WG_CORE_IP_ADDRESS, or the vpn-private hop over loopback.
# $uri is decoded and normalized, hence ~*.
geo $from_vpn_machine {
  default 0;
  10.10.0.0/16 1;
  10.200.0.0/16 1;
}

map $server_addr $private_entry {
  default 0;
  10.1.0.1 1;
  127.0.0.1 1;
}

map "$from_vpn_machine$private_entry$uri" $vpn_machine_blocked {
  default 0;
  "~*^11/(auth|user/vpn)(/|$)" 1;
}

server {
  set $domain vpn.vnoi.info;

  listen 80;
  server_name vpn-private.vnoi.info;

  # Agents upload job output (stream slices) through here.
  client_max_body_size 100m;

  proxy_hide_header  Strict-Transport-Security;
  proxy_hide_header  Content-Security-Policy;
  proxy_hide_header  X-Frame-Options;
  proxy_hide_header  X-XSS-Protection;
  proxy_hide_header  X-Content-Type-Options;
  proxy_hide_header  Referrer-Policy;

  proxy_cookie_domain $domain $host;

  location / {
    # The public block below is on this same nginx; going over loopback lets it trust 127.0.0.1 for the client IP.
    proxy_pass https://127.0.0.1;

    proxy_ssl_server_name on;
    proxy_ssl_name $domain;

    proxy_set_header Host $domain;
    proxy_set_header Referer https://$domain;

    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
#		proxy_set_header CF-Connecting-IP $remote_addr;

    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  }
}


server {
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  set_real_ip_from 127.0.0.1;

  access_log /var/log/nginx/api.log custom;
  server_name vpn.vnoi.info;

  if ($vpn_machine_blocked) {
    return 403;
  }

  proxy_set_header Authorization "Bearer $cookie_accessToken";

  location /user {
    client_max_body_size 100m;
    rewrite /user/(.*) /$1 break;
    proxy_pass http://localhost:8001/;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /auth {
  rewrite /auth/(.*) /$1 break;
    proxy_pass http://localhost:8002/;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /internal {
  rewrite /internal/(.*) /$1 break;
    proxy_pass http://localhost:8003/;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /printing {
    rewrite /printing/(.*) /$1 break;
    proxy_pass http://localhost:8004/;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  listen 80; # Use certbot to get SSL certificate
}
